# Render blueprint for the Macro Board backend.
# Deploy with: Dashboard -> New -> Blueprint, or `render blueprint launch`.
#
# IMPORTANT (free tier):
#   - Alerts only run while the process is alive. On Render's free plan the
#     service spins down after ~15 min of inactivity and wakes on demand, so
#     the alert scheduler will NOT fire 24/7 unless you upgrade to a paid
#     instance or use an uptime pinger to keep it warm. See README notes.
#   - In-memory cache (calendar + prices) resets on each cold start.

services:
  - type: web
    name: macro-board-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: server
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Port Render provides is in process.env.PORT. Express already reads
      # process.env.PORT, so PORT stays unset/automatic.
      - key: DATABASE_TYPE
        value: turso+supabase
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      # Supabase Auth (JWT verify). Set these on Render's dashboard:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # CORS: comma-separated list of allowed browser origins. Set to your
      # deployed Vercel frontend, e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Telegram alerts
      - key: ALERTS_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional fallback data source (free tier: ~1 req/day)
      - key: JBLANKED_API_KEY
        sync: false
